name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - v0.5.12_dev

permissions:
  contents: read

concurrency:
  group: hygon-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Checks
    uses: HYGON-AI/open-source-governance/.github/workflows/pr-quality-gate.yml@5c9f1f8651f6ead34784e8088fa74da74c2dd42f
    permissions:
      contents: read
